#model configuration
model_name: "transformer"
vocab_size: 32000 # 32768
num_layers: 6
num_heads: 8
d_model: 1024
d_ff: 4096
context_length: 512
theta: 10000
pre_norm: true
layer_norm: true
glu: true
num_kv_groups: null
use_skip: false
use_value_embedding: false
# data loading
train_dataset_path: "data/training_data/owt_train.npy"
val_dataset_path: "data/training_data/owt_valid.npy"
tokenizer_vocab_path: "data/tokenizer_data/vocab_owt_train.pkl"
tokenizer_merges_path: "data/tokenizer_data/merges_owt_train.pkl"
#sample_without_replacement: true

# Training configuration
dtype: "bfloat16"
batch_size: 128
min_learning_rate: 1.0e-4
max_learning_rate: 0.0050
weight_decay: 0.1
warmup_steps: 50
total_steps: 12500
cosine_cycle_steps: 12500
steady_steps: 5000
betas: [0.9, 0.999]
eps: 1.0e-8
muon_momentum: 0.95
grad_clip_norm: 1.0
optimizer: "normuon"
scheduler: "cosine"
compile_model: true
grad_accum_steps: 1
sky_ladder: false
sky_ladder_alpha: 0.05
sky_ladder_min_window: 8
sky_ladder_step_interval: 32

# Experiment configuration
experiment_name: "6_layers_deep"
seed: 42
log_interval: 10
initial_save_step: 50
eval_interval: 500
save_interval: 12000
output_dir: "cs336_basics/configs/experiments"
wandb_project: "H100-sxm5-OWT-testruns"
from_checkpoint: null #"cs336_basics/checkpoints/baseline_2000.pth"